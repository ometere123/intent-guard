name: verify

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install genlayer-test==0.29.2
      - run: python -m pip install genvm-linter==0.11.0
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify:decoder
      - run: npm run test:direct
      - run: npm run verify:deployment
      - run: python -m py_compile contracts/IntentGuard.py
      - run: genvm-lint check contracts/IntentGuard.py --json
      - run: npm run build
